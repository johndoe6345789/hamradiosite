services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-7423}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:${BACKEND_PORT:-8317}/api
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8317}:5000"
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - FLASK_ENV=production
      - DATA_DIR=/app/data
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 10s
      retries: 3
      start_period: 15s

volumes:
  backend-data:
