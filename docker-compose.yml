services:
  nginx:
    build: ./docker/nginx
    ports:
      - "${FRONTEND_PORT:-7423}:80"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      - NEXT_PUBLIC_API_URL=/api
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8317}:5000"
    env_file:
      - ../jenkins/secrets/hamradio.env
    environment:
      - FLASK_ENV=production
      - DATA_DIR=/app/data
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 10s
      retries: 3
      start_period: 15s

volumes:
  backend-data:
